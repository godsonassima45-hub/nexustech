version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: technova_db
    environment:
      POSTGRES_DB: technova_prod
      POSTGRES_USER: technova_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-technova_secure_password_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - technova_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technova_user -d technova_prod"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: technova_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - technova_network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password_2024}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application Django
  web:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: technova_web
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=projet.settings_prod
      - DB_NAME=technova_prod
      - DB_USER=technova_user
      - DB_PASSWORD=${DB_PASSWORD:-technova_secure_password_2024}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-very-secure-secret-key-change-in-production}
      - DOMAIN_NAME=${DOMAIN_NAME:-technova.fr}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-technova.fr,www.technova.fr,localhost}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-contact@technova.fr}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - technova_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Serveur Web Nginx
  nginx:
    image: nginx:alpine
    container_name: technova_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - technova_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker pour les tâches de fond (Celery)
  worker:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: technova_worker
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=projet.settings_prod
      - DB_NAME=technova_prod
      - DB_USER=technova_user
      - DB_PASSWORD=${DB_PASSWORD:-technova_secure_password_2024}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-very-secure-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - technova_network
    restart: unless-stopped
    command: celery -A projet worker -l info --loglevel=INFO

  # Beat pour les tâches planifiées (Celery)
  beat:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    container_name: technova_beat
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=projet.settings_prod
      - DB_NAME=technova_prod
      - DB_USER=technova_user
      - DB_PASSWORD=${DB_PASSWORD:-technova_secure_password_2024}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-very-secure-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - technova_network
    restart: unless-stopped
    command: celery -A projet beat -l info --loglevel=INFO

  # Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: technova_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - technova_network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Monitoring (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: technova_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - technova_network
    restart: unless-stopped

  # Logs (ELK Stack)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: technova_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - technova_network
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.5.0
    container_name: technova_logstash
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline
      - ./logs:/logs
    networks:
      - technova_network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.0
    container_name: technova_kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - technova_network
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  technova_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
