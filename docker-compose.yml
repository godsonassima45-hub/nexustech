version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: proservices_db
    environment:
      POSTGRES_DB: proservices
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - proservices_network
    restart: unless-stopped

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: proservices_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - proservices_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Application Django
  web:
    build: .
    container_name: proservices_web
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=projet.settings_prod
      - DB_NAME=proservices
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY=django-insecure-production-key-change-me
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - proservices_network
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Serveur Web Nginx
  nginx:
    image: nginx:alpine
    container_name: proservices_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
    networks:
      - proservices_network
    restart: unless-stopped

  # Worker pour les tâches de fond (optionnel)
  worker:
    build: .
    container_name: proservices_worker
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=projet.settings_prod
      - DB_NAME=proservices
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - proservices_network
    restart: unless-stopped
    command: celery -A projet worker -l info

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  proservices_network:
    driver: bridge
